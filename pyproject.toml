[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-decision-eval"
version = "0.1.0"
description = "Offline scoring of agent memory decisions and observed tool calls."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
memory-decision-eval = "memory_decision_eval.__main__:main"

[project.urls]
Repository = "https://github.com/Garyouki/memory-decision-eval"

[tool.setuptools]
packages = ["memory_decision_eval"]
